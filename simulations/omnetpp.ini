# Modificado por André do Valle Medeiros em 2026: configurações das comparações ALOHA x LMAC-1,
# do teste de cobertura e do diagnóstico do terminal oculto.

[General]
network = flora.simulations.LoRaNetworkTest
**.maxTransmissionDuration = 4s
**.energyDetection = -110dBm

# Cmdenv sem animação
cmdenv-express-mode = true
cmdenv-autoflush = false
cmdenv-status-frequency = 5s

# as configurações de comparação desligam os vetores
**.vector-recording = true
**.scalar-recording = true

rng-class = "cMersenneTwister"

# RNG: 0 para o meio e o servidor, 1+i para o nó i e seus submódulos, 1001+i para a
# posição do nó i e 2001 para o gateway. O mapa rng-k não é herdado, daí duas chaves.
num-rngs = 2002
**.loRaNodes[*].rng-0 = 1 + index
**.loRaNodes[*].**.rng-0 = 1 + int(substringBefore(substringAfter(fullPath(), "loRaNodes["), "]"))
**.loRaNodes[*].rng-1 = 1001 + index
**.loRaGW[*].rng-0 = 2001 + index
**.loRaGW[*].**.rng-0 = 2001 + int(substringBefore(substringAfter(fullPath(), "loRaGW["), "]"))

# LMAC-1: janela RX2 e duração de um CAD (SF7, 125 kHz)
**.loRaNodes[*].LoRaNic.mac.listening2Time = 1s
**.loRaNodes[*].LoRaNic.mac.cadDuration = 0.00128s

**.loRaGW[*].numUdpApps = 1
**.loRaGW[0].packetForwarder.localPort = 2000
**.loRaGW[0].packetForwarder.destPort = 1000
**.loRaGW[0].packetForwarder.destAddresses = "networkServer"
**.loRaGW[0].packetForwarder.indexNumber = 0

**.networkServer.numApps = 1
**.networkServer.**.evaluateADRinServer = false
**.networkServer.app[0].typename = "NetworkServerApp"
**.networkServer.app[0].destAddresses = "loRaGW[0]"
**.networkServer.app[0].destPort = 2000
**.networkServer.app[0].localPort = 1000
**.networkServer.app[0].adrMethod = ${"avg"}

**.numberOfPacketsToSend = 0 
sim-time-limit = 60s
simtime-resolution = -11
repeat = 10

**.alohaChannelModel = false

# Valores padrão de topologia e rádio; os cenários abaixo sobrescrevem área, nós e canal.
**.numberOfNodes = 50
**.constraintAreaMaxX = 25m
**.constraintAreaMaxY = 38m

**.loRaNodes[*].**.initialX = uniform(0m, 25m)
**.loRaNodes[*].**.initialY = uniform(0m, 38m)

**.loRaNodes[*].**initialLoRaSF = select(index % 16,
	7, 7, 7, 7, 7, 7, 7, 7,
	8, 8, 8, 8, 8, 8, 8, 8)
**.loRaNodes[*].**initialLoRaCF = select(index % 16,
	868.1MHz, 868.3MHz, 868.5MHz, 867.1MHz,
	867.3MHz, 867.5MHz, 867.7MHz, 867.9MHz,
	868.1MHz, 868.3MHz, 868.5MHz, 867.1MHz,
	867.3MHz, 867.5MHz, 867.7MHz, 867.9MHz)
**.loRaNodes[*].**initialLoRaTP = 14dBm  # 25 mW
**.loRaNodes[*].**initialLoRaBW = 125 kHz
# CR 4/5 (no FLoRa, 1 = 4/5 e 4 = 4/8)
**.loRaNodes[*].**initialLoRaCR = 1
**.loRaNodes[*].**.initFromDisplayString = false
**.loRaNodes[*].**.evaluateADRinNode = false

**.loRaNodes[*].numApps = 1
**.loRaNodes[*].app[0].typename = "SimpleLoRaApp"
**.loRaNodes[*].app[0].packetLength = 16B
**.loRaNodes[*].app[0].dataSize = 16B
**.loRaNodes[*].app[0].dutyCyclePercent = 1

# gateway
**.numberOfGateways = 1
**.loRaGW[0].**.initialX = 12.5m
**.loRaGW[0].**.initialY = 19m
**.LoRaGWNic.radio.iAmGateway = true
**.loRaGW[*].**.initFromDisplayString = false

# Energia, meio e perda de propagação
**.loRaNodes[*].LoRaNic.radio.energyConsumer.typename = "LoRaEnergyConsumer"
**.loRaNodes[*].**.energySourceModule = "^.IdealEpEnergyStorage"
**.loRaNodes[*].LoRaNic.radio.energyConsumer.configFile = xmldoc("energyConsumptionParameters.xml")

# perda de Oulu com o sombreamento padrão do modelo (desvio-padrão de 7,8 dB)
**.sigma = 7.8
**.constraintAreaMinX = 0m
**.constraintAreaMinY = 0m
**.constraintAreaMinZ = 0m
**.constraintAreaMaxZ = 0m

LoRaNetworkTest.**.radio.separateTransmissionParts = false
LoRaNetworkTest.**.radio.separateReceptionParts = false

**.ipv4Delayer.config = xmldoc("cloudDelays.xml")
**.radio.radioMediumModule = "LoRaMedium"
**.LoRaMedium.pathLoss.typename = "flora.LoRaPhy.LoRaPathLossOulu"
**.minInterferenceTime = 0s
**.displayAddresses = false

**.LoRaMedium.rangeFilter = "communicationRange"

# Teste de cobertura: um nó ALOHA a distâncias fixas do gateway
[Config Teste_Cobertura_1_No]
description = "Teste de cobertura: um nó ALOHA a distâncias fixas do gateway"
extends = General

**.numberOfNodes = 1

**.loRaNodes[*].LoRaNic.mac.typename = "LoRaMac"

# área de 4,5 km x 200 m, com o gateway na borda esquerda
**.constraintAreaMinX = 0m
**.constraintAreaMinY = 0m
**.constraintAreaMaxX = 4500m
**.constraintAreaMaxY = 200m

**.loRaGW[0].**.initialX = 0m
**.loRaGW[0].**.initialY = 100m

# distância do nó ao gateway, uma por execução
**.loRaNodes[*].**.initialX = ${distancia=10,200,500,1000,1500,2500,4000}m
**.loRaNodes[*].**.initialY = 100m

# uma mensagem a cada 10 s durante 300 s
**.timeToFirstPacket = 5s
**.timeToNextPacket = 10s
sim-time-limit = 300s

# Comparação ALOHA x LMAC-1: 100 nós num disco de raio de 1 km, canal único
[Config Comparacao_Base]
description = "Base das comparações: disco de raio de 1 km com o gateway no centro, canal único SF7, 12 h simuladas"
extends = General

# raio de 1 km com o gateway no centro; r e theta de cada nó são sorteados uma vez (rng-1
# do nó) e guardados em maxGatewayDistance e gatewayX, que o FLoRa não usa aqui
**.constraintAreaMinX = 0m
**.constraintAreaMinY = 0m
**.constraintAreaMaxX = 2200m
**.constraintAreaMaxY = 2200m
**.loRaGW[0].**.initialX = 1100m
**.loRaGW[0].**.initialY = 1100m
**.loRaNodes[*].maxGatewayDistance = sqrt(uniform(0, 1, 1))
**.loRaNodes[*].gatewayX = uniform(0, 6.283185307, 1)
**.loRaNodes[*].mobility.initialX = 1100m + 1000m*parent.maxGatewayDistance*cos(parent.gatewayX)
**.loRaNodes[*].mobility.initialY = 1100m + 1000m*parent.maxGatewayDistance*sin(parent.gatewayX)

# canal único e SF7 para todos os nós
**.loRaNodes[*].**initialLoRaSF = 7
**.loRaNodes[*].**initialLoRaCF = 868.1MHz

# 12 h simuladas
sim-time-limit = 43200s

# só escalares: a PLR é calculada a partir deles
**.vector-recording = false

[Config Comparacao_N100_Base]
description = "100 nós, raio de 1 km"
extends = Comparacao_Base
**.numberOfNodes = 100

# protocolo: ALOHA com duty cycle de 1%, LMAC-1 com 2,8%
[Config Comparacao_N100_ALOHA_Base]
description = "ALOHA, raio de 1 km, duty cycle de 1%"
extends = Comparacao_N100_Base
**.loRaNodes[*].LoRaNic.mac.typename = "LoRaMac"

[Config Comparacao_N100_LMAC_Base]
description = "LMAC-1, raio de 1 km, duty cycle de 2,8%"
extends = Comparacao_N100_Base
**.loRaNodes[*].LoRaNic.mac.typename = "Lmac1Mac"
**.loRaNodes[*].app[0].dutyCyclePercent = 2.8

# período médio entre mensagens: 60, 30 e 15 s
[Config Comparacao_N100_ALOHA_60s]
description = "ALOHA, raio de 1 km, intervalo médio de 60 s"
extends = Comparacao_N100_ALOHA_Base
**.timeToFirstPacket = uniform(0s, 60s)
**.timeToNextPacket = exponential(60s)

[Config Comparacao_N100_ALOHA_30s]
description = "ALOHA, raio de 1 km, intervalo médio de 30 s"
extends = Comparacao_N100_ALOHA_Base
**.timeToFirstPacket = uniform(0s, 30s)
**.timeToNextPacket = exponential(30s)

[Config Comparacao_N100_ALOHA_15s]
description = "ALOHA, raio de 1 km, intervalo médio de 15 s"
extends = Comparacao_N100_ALOHA_Base
**.timeToFirstPacket = uniform(0s, 15s)
**.timeToNextPacket = exponential(15s)

[Config Comparacao_N100_LMAC_60s]
description = "LMAC-1, raio de 1 km, intervalo médio de 60 s"
extends = Comparacao_N100_LMAC_Base
**.timeToFirstPacket = uniform(0s, 60s)
**.timeToNextPacket = exponential(60s)

[Config Comparacao_N100_LMAC_30s]
description = "LMAC-1, raio de 1 km, intervalo médio de 30 s"
extends = Comparacao_N100_LMAC_Base
**.timeToFirstPacket = uniform(0s, 30s)
**.timeToNextPacket = exponential(30s)

[Config Comparacao_N100_LMAC_15s]
description = "LMAC-1, raio de 1 km, intervalo médio de 15 s"
extends = Comparacao_N100_LMAC_Base
**.timeToFirstPacket = uniform(0s, 15s)
**.timeToNextPacket = exponential(15s)

# Comparação ALOHA x LMAC-1 com raio de 2 km (os mesmos 100 nós, área 4 vezes maior)
[Config Comparacao_AreaAmpliada_Base]
description = "Base com raio de 2 km: 100 nós, gateway no centro"
extends = Comparacao_Base

# mesmo sorteio de r e theta, com o raio e o centro dobrados
**.constraintAreaMinX = 0m
**.constraintAreaMinY = 0m
**.constraintAreaMaxX = 4200m
**.constraintAreaMaxY = 4200m
**.loRaGW[0].**.initialX = 2100m
**.loRaGW[0].**.initialY = 2100m
**.loRaNodes[*].mobility.initialX = 2100m + 2000m*parent.maxGatewayDistance*cos(parent.gatewayX)
**.loRaNodes[*].mobility.initialY = 2100m + 2000m*parent.maxGatewayDistance*sin(parent.gatewayX)

**.numberOfNodes = 100

# protocolo: ALOHA com duty cycle de 1%, LMAC-1 com 2,8%
[Config Comparacao_AreaAmpliada_ALOHA_Base]
description = "ALOHA, raio de 2 km, duty cycle de 1%"
extends = Comparacao_AreaAmpliada_Base
**.loRaNodes[*].LoRaNic.mac.typename = "LoRaMac"

[Config Comparacao_AreaAmpliada_LMAC_Base]
description = "LMAC-1, raio de 2 km, duty cycle de 2,8%"
extends = Comparacao_AreaAmpliada_Base
**.loRaNodes[*].LoRaNic.mac.typename = "Lmac1Mac"
**.loRaNodes[*].app[0].dutyCyclePercent = 2.8

# período médio entre mensagens: 60, 30 e 15 s
[Config Comparacao_AreaAmpliada_ALOHA_60s]
description = "ALOHA, raio de 2 km, intervalo médio de 60 s"
extends = Comparacao_AreaAmpliada_ALOHA_Base
**.timeToFirstPacket = uniform(0s, 60s)
**.timeToNextPacket = exponential(60s)

[Config Comparacao_AreaAmpliada_ALOHA_30s]
description = "ALOHA, raio de 2 km, intervalo médio de 30 s"
extends = Comparacao_AreaAmpliada_ALOHA_Base
**.timeToFirstPacket = uniform(0s, 30s)
**.timeToNextPacket = exponential(30s)

[Config Comparacao_AreaAmpliada_ALOHA_15s]
description = "ALOHA, raio de 2 km, intervalo médio de 15 s"
extends = Comparacao_AreaAmpliada_ALOHA_Base
**.timeToFirstPacket = uniform(0s, 15s)
**.timeToNextPacket = exponential(15s)

[Config Comparacao_AreaAmpliada_LMAC_60s]
description = "LMAC-1, raio de 2 km, intervalo médio de 60 s"
extends = Comparacao_AreaAmpliada_LMAC_Base
**.timeToFirstPacket = uniform(0s, 60s)
**.timeToNextPacket = exponential(60s)

[Config Comparacao_AreaAmpliada_LMAC_30s]
description = "LMAC-1, raio de 2 km, intervalo médio de 30 s"
extends = Comparacao_AreaAmpliada_LMAC_Base
**.timeToFirstPacket = uniform(0s, 30s)
**.timeToNextPacket = exponential(30s)

[Config Comparacao_AreaAmpliada_LMAC_15s]
description = "LMAC-1, raio de 2 km, intervalo médio de 15 s"
extends = Comparacao_AreaAmpliada_LMAC_Base
**.timeToFirstPacket = uniform(0s, 15s)
**.timeToNextPacket = exponential(15s)

# Diagnóstico do terminal oculto: dois aglomerados de 50 nós (raio de 100 m) a 2 km de
# cada lado do gateway; os aglomerados não se ouvem, mas o gateway ouve os dois
[Config TerminalOculto_Base]
description = "Diagnóstico do terminal oculto: dois aglomerados de 50 nós a 2 km de cada lado do gateway, sem sombreamento"
extends = Comparacao_AreaAmpliada_Base
**.numberOfNodes = 100

# sem sombreamento: o nó mais distante chega ao gateway só 3,6 dB acima da sensibilidade
**.sigma = 0

# área mais larga, com o gateway no centro e 200 m de folga para os aglomerados
**.constraintAreaMaxX = 4600m
**.loRaGW[0].**.initialX = 2300m

# aglomerado esquerdo (nós 0 a 49) em x = 300 m e direito (50 a 99) em x = 4300 m; o
# índice entra no padrão da chave porque index não vale nos submódulos do nó
**.loRaNodes[0..49].mobility.initialX = 300m + 100m*parent.maxGatewayDistance*cos(parent.gatewayX)
**.loRaNodes[50..99].mobility.initialX = 4300m + 100m*parent.maxGatewayDistance*cos(parent.gatewayX)
**.loRaNodes[*].mobility.initialY = 2100m + 100m*parent.maxGatewayDistance*sin(parent.gatewayX)

sim-time-limit = 3600s

[Config TerminalOculto_ALOHA_15s]
description = "Terminal oculto, ALOHA, intervalo médio de 15 s"
extends = TerminalOculto_Base
**.loRaNodes[*].LoRaNic.mac.typename = "LoRaMac"
**.timeToFirstPacket = uniform(0s, 15s)
**.timeToNextPacket = exponential(15s)

[Config TerminalOculto_LMAC_15s]
description = "Terminal oculto, LMAC-1, intervalo médio de 15 s"
extends = TerminalOculto_Base
**.loRaNodes[*].LoRaNic.mac.typename = "Lmac1Mac"
**.loRaNodes[*].app[0].dutyCyclePercent = 2.8
**.timeToFirstPacket = uniform(0s, 15s)
**.timeToNextPacket = exponential(15s)
